# nginx reverse proxy สำหรับระบบ PR
# วางที่ /etc/nginx/sites-available/mtp-pr.conf แล้ว ln -s ไป sites-enabled
#
#   https://pr.company.local/api/*  →  http://127.0.0.1:4000  (NestJS)
#   https://pr.company.local/*      →  http://127.0.0.1:3000  (Next.js)
#
# ⚠️ proxy_pass ต้อง "ไม่มี path ต่อท้าย" (http://127.0.0.1:4000; ไม่ใช่ .../api/)
#    nginx จึงส่ง URL ต้นฉบับต่อไปตรง ๆ — เลขที่ PR ที่มี "/" (เช่น 002%2F0086) ไม่ถูกถอดรหัสกลางทาง

upstream mtp_pr_backend  { server 127.0.0.1:4000; keepalive 16; }
upstream mtp_pr_frontend { server 127.0.0.1:3000; keepalive 16; }

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name pr.company.local;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 มากับ nginx 1.24 — ใช้รูปแบบ "listen ... http2" (nginx 1.25+ จะเตือนให้ใช้ "http2 on;" แทน แต่ยังทำงาน)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pr.company.local;

    ssl_certificate     /etc/ssl/mtp-pr/pr.company.local.crt;   # certificate + intermediate (fullchain)
    ssl_certificate_key /etc/ssl/mtp-pr/pr.company.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API → NestJS (รายงานใหญ่ใช้เวลาสร้าง PDF ได้ถึง ~1 นาที)
    location /api/ {
        proxy_pass http://mtp_pr_backend;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # หน้าเว็บ → Next.js
    location / {
        proxy_pass http://mtp_pr_frontend;
        proxy_read_timeout 60s;
    }
}
